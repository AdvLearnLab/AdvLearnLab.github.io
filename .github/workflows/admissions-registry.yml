name: Update admissions registry

on:
  issues:
    types: [opened, edited, reopened, closed, deleted]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.body || '', '<!-- admissions-registry -->')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build registry data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-admissions-registry.mjs
      - name: Commit updated data
        run: |
          if git diff --quiet -- assets/data/admissions-registry.json; then
            echo "Registry data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/admissions-registry.json
          git commit -m "Update admissions registry data"
          git push
